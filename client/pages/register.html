<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — StatFoot Pro</title>
  <link rel="stylesheet" href="../styles/global.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">⚽ StatFoot Pro</div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="username">Nombre de usuario</label>
        <input class="form-input" type="text" id="username"
               placeholder="tu_usuario" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-email">Correo electrónico</label>
        <input class="form-input" type="email" id="reg-email"
               placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password">Contraseña</label>
        <input class="form-input" type="password" id="reg-password"
               placeholder="Mínimo 8 caracteres" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirmar contraseña</label>
        <input class="form-input" type="password" id="confirm-password"
               placeholder="Repite la contraseña" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        Crear cuenta
      </button>
    </form>

    <p class="auth-footer-text">
      ¿Ya tienes cuenta? <a href="login.html">Ingresar</a>
    </p>
  </div>

</body>
</html>
